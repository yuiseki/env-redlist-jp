checked:
  note: scripts/02_verify.py, with DuckDB 1.5.6, before upload; all passed
  items:
    - raw files against MANIFEST.json (size, sha256, decodes in the recorded encoding, record count by the csv module)
    - Parquet rows equal the raw data records counted with Python's csv module, and the pinned counts
    - column names equal the flattened raw header, in order
    - every column of the type its name gives
    - every value equal to the raw value; sha256 over all values equal on both sides
    - header rows in the Parquet metadata equal the raw header rows
    - a plain DuckDB with only built-in extensions opens every file
    - no bloom filters

modifications:
  raw: none. The Ministry's CSVs, byte for byte.
  parquet:
    - decoded into UTF-8 from each file's encoding
    - 2026 header rows flattened to "<row 2>_<row 3>", or "<row 3>" where row 2 is empty; original rows kept in key-value metadata source_header_rows
    - 133 columns of the 2026 files holding 0 or 1 typed as INTEGER; a value other than 0 or 1 stops the build
    - every other column is the CSV text; no category, bracket, numeral, dash or space normalised
    - row order as in the CSV
    - written with zstd, without bloom filters
